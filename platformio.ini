[platformio]
default_envs = pico_w

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<button_debouncer.cpp> +<chime_schedule.cpp> +<clock_control.cpp> +<clock_time.cpp> +<control_json.cpp> +<config_json.cpp> +<clock_face.cpp> +<device_metrics.cpp> +<display_schedule.cpp> +<http_headers.cpp> +<http_request.cpp> +<mac_address.cpp> +<network_identity.cpp> +<number_format.cpp> +<power_save.cpp> +<status_text.cpp> +<timezone.cpp>
build_flags =
    -std=gnu++17

[env:pico_w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = rpipicow
framework = picosdk
build_type = release

; Reserve the final 4 KiB flash sector for persistent clock configuration.
board_upload.maximum_size = 2093056

upload_protocol = picotool
monitor_port = /dev/ttyACM0
monitor_speed = 115200

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DNDEBUG
    -include $PROJECT_DIR/include/lwipopts.h
    -DPIO_STDIO_USB=1
    -DPICO_STDIO_USB_CONNECT_WAIT_TIMEOUT_MS=0
    -DPICO_CLOCK_CONFIG_FLASH_OFFSET=2093056
